# Condense（浓缩阅读）— XcodeGen 工程定义
# 用法：xcodegen generate（需要安装 xcodegen 与 Xcode 26）

name: Condense

options:
  bundleIdPrefix: com.condense
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:

  Condense:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Condense
        excludes:
          - "Condense.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.condense.app
        CODE_SIGN_ENTITLEMENTS: Condense/Condense.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
      - target: CondenseShare
        embed: true
        codeSign: true
    info:
      path: Condense/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: 浓缩阅读
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        # 以 iPhone 竖屏为主
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 可选：允许后台刷新时拉取共享收件箱
        UIBackgroundModes:
          - fetch
        UILaunchScreen: {}

  CondenseShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CondenseShare
        excludes:
          - "CondenseShare.entitlements"
          - "Info.plist"
      # 与主 App 共享的收件箱读写逻辑
      - path: Condense/Services/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.condense.app.share
        CODE_SIGN_ENTITLEMENTS: CondenseShare/CondenseShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CondenseShare/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: 浓缩阅读
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # 支持：纯文本 / 网页 URL / 网页 / 文件（PDF、DOCX 等），各限 1 个
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1

  CondenseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CondenseUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.condense.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        # UI 测试 bundle 本身不需要签名
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Condense

schemes:
  Condense:
    build:
      targets:
        Condense: all
        CondenseShare: all
    test:
      targets:
        - CondenseUITests
